
<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6b472d" />
    <meta
      name="description"
      content="Kovanını izle, arılarını tanı ve balını biriktir."
    />
    <title>Arıcılık - Sakin Bir Kovan</title>
  </head>
  <body>
    <div id="app">
      <header id="top-bar">
        <div class="game-title">🐝 Arıcılık</div>
        <div id="honey-counter">🍯 0 g bal</div>
      </header>

      <main id="game-layout">
        
        <section id="game-container" aria-label="Arıcılık oyun alanı">
          <div id="loading-message">Kovan hazırlanıyor...</div>
<!-- Mağaza düğmesi -->
<button id="shop-toggle" type="button" aria-label="Arı mağazasını aç">
  🛍️ Mağaza
</button>

<!-- Mağaza paneli -->
<div id="shop-panel" hidden>
  <div id="shop-header">
    <h2>🐝 Arı Mağazası</h2>
    <button id="shop-close" type="button" aria-label="Mağazayı kapat">
      ✕
    </button>
  </div>

<div id="shop-content">
  <div id="shop-categories">
    <button class="shop-category active" data-category="bees">
      🐝 Arılar
    </button>
  </div>

  <div id="shop-items">
    <p>Arı mağazası hazırlanıyor...</p>
  </div>
</div>
</div>
          <div id="chat-panel">
            <div id="chat-header">💬 Kovan Sohbeti</div>
            <div id="chat-messages" aria-live="polite">
              <div class="chat-system-message">Sohbete hoş geldin!</div>
            </div>
            <form id="chat-form">
              <input
                id="chat-input"
                type="text"
                maxlength="200"
                placeholder="Mesajını yaz..."
                autocomplete="off"
                aria-label="Sohbet mesajı"
              />
              <button type="submit">Gönder</button>
            </form>
          </div>
        </section>


        <aside id="bee-panel">
          <h2>Arılarım</h2>
          <p id="bee-count">5 arı</p>
          <div id="bee-list"></div>
        </aside>
      </main>

      <footer id="game-footer">
        Sakin bir gün, çalışkan arılar.
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
